name: Build Game Linux (Haswell Fix)

on:
  push:
    branches: ['**'] # Compila automáticamente al hacer push en cualquier rama
  workflow_dispatch:
    inputs:
      upstream:
        description: Versión base de Horizon (nightly por defecto)
        default: nightly
        required: true

permissions:
  contents: read

env:
  UPSTREAM: ${{ github.event.inputs.upstream || 'nightly' }}
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      HORIZON_VERSION: nightly-custom
      HORIZON_NIGHTLY: custom-${{ github.sha }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game-linux

      - name: Instalar dependencias de sistema (ALSA y udev)
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libasound2-dev libudev-dev

      - name: Descargar paquete base de Horizon Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream
          gh release download "$UPSTREAM" -R horizon-rust/horizon -D upstream -p "horizon-linux-x86_64.tar.gz"

      - name: Compilar cliente modificado (horizon-client)
        run: cargo build --release --locked -p horizon-client --bin horizon-client

      - name: Reemplazar binario en el paquete de Horizon
        run: |
          set -euo pipefail
          mkdir -p dist
          cd upstream
          tar -xzf horizon-linux-x86_64.tar.gz
          rm horizon-linux-x86_64.tar.gz
          found=$(find . -type f -name "horizon-client" | head -1)
          [[ -n "$found" ]] || { echo "::error::No se encontró horizon-client en el paquete"; exit 1; }
          cp ../target/release/horizon-client "$found"
          chmod +x "$found"
          top=$(dirname "$found" | cut -d/ -f2)
          tar -czf ../dist/horizon-linux-haswell.tar.gz "$top"

      - name: Subir paquete listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: horizon-linux-haswell
          path: dist/horizon-linux-haswell.tar.gz
