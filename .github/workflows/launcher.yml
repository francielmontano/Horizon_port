name: Build Launcher Linux Only

on:
  push:
    branches: ['**'] # Compila automáticamente al hacer push en cualquier rama
  workflow_dispatch: # Te permite iniciarlo manualmente desde la pestaña Actions

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: linux

      - name: Linux libraries GPUI links to
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev

      - name: Build launcher release
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p ../dist
          tar -czf ../dist/horizon-launcher-linux-x86_64.tar.gz -C target/release horizon-launcher

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-linux-x86_64
          path: dist/horizon-launcher-linux-x86_64.tar.gz